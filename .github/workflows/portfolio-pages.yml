name: Deploy portfolio to GitHub Pages
on:
  push:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/portfolio-pages.yml'
  pull_request:
    branches: [main]
    paths:
      - 'portfolio/**'
      - '.github/workflows/portfolio-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: portfolio-pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.repository == 'Sheethaleenuganti/Sheethaleenuganti.github.io'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: portfolio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portfolio/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: portfolio/dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
